[platformio]
src_dir = ../../examples/IRIVSecurePublish

[env:cytron_iriv_io_controller]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = cytron_iriv_io_controller
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1m
build_flags = -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
lib_ldf_mode = chain+
lib_deps =
    symlink://../..
    symlink://../../../IRIVIOCHardware
    symlink://../../../WilcoxonMqtt
    bblanchon/ArduinoJson @ ^6.21.3
