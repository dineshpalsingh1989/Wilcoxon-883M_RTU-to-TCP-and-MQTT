[platformio]
default_envs = cytron_iriv_io_controller
extra_configs = profile.ini

[env]
; Pinned to the tested platform: CI firmware builds have failed since espressif32 8.0.0 (2026-10-19).
platform = espressif32 @ 7.1.3
framework = arduino
build_flags = -Isrc
extra_scripts =
    pre:scripts/build_config.py
    post:scripts/web_installer.py
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/Adafruit NeoPixel @ ^1.11.0
