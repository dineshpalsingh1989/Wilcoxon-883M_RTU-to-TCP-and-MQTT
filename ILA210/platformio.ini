[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/web_installer.py
build_flags = -Isrc
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    knolleary/PubSubClient @ 2.8
    4-20ma/ModbusMaster @ 2.0.1
    emelianov/modbus-esp8266 @ 4.1.0

[env:esp32s3]
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel @ 1.15.2

[env:cytron_iriv_io_controller]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = cytron_iriv_io_controller
board_build.core = earlephilhower
board_build.filesystem_size = 1m
build_flags = ${env.build_flags} -DBOARD_CYTRON_IRIV_IOC -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
lib_ldf_mode = chain+
lib_ignore = Adafruit NeoPixel, iLabs_Hearth
