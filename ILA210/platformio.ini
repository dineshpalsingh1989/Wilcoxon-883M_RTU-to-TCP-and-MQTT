[platformio]
extra_configs =
    ESP32 Family/ESP32-S3/profile.ini
    IRIV IOC/profile.ini

[env]
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/select_board.py
    pre:scripts/board_helpers.py
    post:scripts/web_installer.py
build_flags = -Isrc
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    knolleary/PubSubClient @ 2.8
