[platformio]
default_envs = cytron_iriv_io_controller
extra_configs = profile.ini

[env]
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/release_version.py
    post:scripts/web_installer.py
build_flags = -Isrc
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    knolleary/PubSubClient @ 2.8
    4-20ma/ModbusMaster @ 2.0.1
    emelianov/modbus-esp8266 @ 4.1.0
