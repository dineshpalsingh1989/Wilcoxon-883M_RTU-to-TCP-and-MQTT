[env:cytron_iriv_io_controller]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = cytron_iriv_io_controller
board_build.core = earlephilhower
board_build.filesystem_size = 1m
build_flags = ${env.build_flags} -DBOARD_CYTRON_IRIV_IOC -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
lib_ldf_mode = chain+
; MQTT uses the board-local WilcoxonMqtt library, so PubSubClient is not needed here.
lib_deps = bblanchon/ArduinoJson @ 6.21.5
lib_ignore = Adafruit NeoPixel, iLabs_Hearth
