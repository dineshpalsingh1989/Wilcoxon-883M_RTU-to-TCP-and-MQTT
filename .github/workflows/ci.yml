name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node demo/smoke_test.js
  firmware:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18 certifi
      # Every [env:...] in platformio.ini is a supported board.
      - run: pio run
      - name: Bundle browser installer images
        run: pio run -t webinstaller
      - name: Prepare board binaries
        run: |
          for board in adafruit_feather_esp32s3 cytron_maker_esp32; do
            cp .pio/build/$board/firmware.bin firmware-$board.bin
            cp .pio/build/$board/factory.bin factory-$board.bin
            (cd .pio/build/$board/web-installer && zip -q "$GITHUB_WORKSPACE/web-installer-$board.zip" *)
          done
          # RP2350: .uf2 for USB drag-and-drop install, .bin for the gateway's firmware upload.
          board=cytron_iriv_io_controller
          cp .pio/build/$board/firmware.bin firmware-$board.bin
          cp .pio/build/$board/firmware.uf2 firmware-$board.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-firmware
          path: |
            firmware-*.bin
            firmware-*.uf2
            web-installer-*.zip
            factory-*.bin
