name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node demo/smoke_test.js
  firmware:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18 certifi
      - run: pio run -e adafruit_feather_esp32s3
      - name: Bundle browser installer images
        run: pio run -e adafruit_feather_esp32s3 -t webinstaller
      - name: Prepare board binaries
        run: |
          cp .pio/build/adafruit_feather_esp32s3/firmware.bin firmware-adafruit_feather_esp32s3.bin
          cp .pio/build/adafruit_feather_esp32s3/factory.bin factory-adafruit_feather_esp32s3.bin
          (cd .pio/build/adafruit_feather_esp32s3/web-installer && zip -q "$GITHUB_WORKSPACE/web-installer-adafruit_feather_esp32s3.zip" *)
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-firmware
          path: |
            firmware-adafruit_feather_esp32s3.bin
            web-installer-adafruit_feather_esp32s3.zip
            factory-adafruit_feather_esp32s3.bin
  release:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gateway-firmware
      - name: Attach firmware to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Beta tags (v1.2.3-beta.N) become pre-releases that never replace "Latest";
          # the gateway updater only offers the latest stable release.
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=()
          fi
          # Install instructions go above GitHub's generated change list.
          pages="https://${GH_REPO%%/*}.github.io/${GH_REPO#*/}/"
          {
            echo "## Install"
            echo
            echo "- **Easiest:** open the [web installer]($pages) in Chrome or Edge, plug in the Feather ESP32-S3 and click **Install**."
            echo "- **Manual, any flashing tool:** write \`factory-adafruit_feather_esp32s3.bin\` at address \`0x0\`. This clears saved settings."
            echo "- **Gateway already running:** \`firmware-adafruit_feather_esp32s3.bin\` is the OTA update file."
            echo
            echo "Guide and troubleshooting: [installing-firmware.md](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/installing-firmware.md)"
          } > install-notes.md
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --notes "$(cat install-notes.md)" "${flags[@]}"
          gh release upload "$RELEASE_TAG" firmware-adafruit_feather_esp32s3.bin \
            web-installer-adafruit_feather_esp32s3.zip factory-adafruit_feather_esp32s3.bin --clobber
  installer:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/installer-pages.yml
  package:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gateway-firmware
      - name: Publish firmware image to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPO,,}"
          printf 'FROM scratch\nCOPY firmware-adafruit_feather_esp32s3.bin /\n' > Dockerfile
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tags=(-t "$image:${REF_NAME}")
          [[ "$REF_NAME" == *-beta.* ]] || tags+=(-t "$image:latest")
          docker build --label "org.opencontainers.image.source=https://github.com/${REPO}" "${tags[@]}" .
          for attempt in 1 2 3; do
            docker push --all-tags "$image" && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
