name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node demo/smoke_test.js
  firmware:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18 certifi
      - run: pio run -e adafruit_feather_esp32s3
      - name: Prepare board binary
        run: cp .pio/build/adafruit_feather_esp32s3/firmware.bin firmware-adafruit_feather_esp32s3.bin
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-firmware
          path: firmware-adafruit_feather_esp32s3.bin
  release:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gateway-firmware
      - name: Attach firmware to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Beta tags (v1.2.3-beta.N) become pre-releases that never replace "Latest";
          # the gateway updater only offers the latest stable release.
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=()
          fi
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}"
          gh release upload "$RELEASE_TAG" firmware-adafruit_feather_esp32s3.bin --clobber
  package:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gateway-firmware
      - name: Publish firmware image to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPO,,}"
          printf 'FROM scratch\nCOPY firmware-adafruit_feather_esp32s3.bin /\n' > Dockerfile
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tags=(-t "$image:${REF_NAME}")
          [[ "$REF_NAME" == *-beta.* ]] || tags+=(-t "$image:latest")
          docker build --label "org.opencontainers.image.source=https://github.com/${REPO}" "${tags[@]}" .
          for attempt in 1 2 3; do
            docker push --all-tags "$image" && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
