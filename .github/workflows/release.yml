name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node demo/smoke_test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p "test_*.py"
  firmware:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18 certifi
      # Every [env:...] in platformio.ini is a supported board.
      - run: pio run
      - name: Bundle browser installer images
        run: pio run -t webinstaller
      - name: Prepare board binaries
        run: |
          for board in adafruit_feather_esp32s3 cytron_maker_esp32; do
            cp .pio/build/$board/firmware.bin firmware-$board.bin
            cp .pio/build/$board/factory.bin factory-$board.bin
            (cd .pio/build/$board/web-installer && zip -q "$GITHUB_WORKSPACE/web-installer-$board.zip" *)
          done
          # RP2350: .uf2 for USB drag-and-drop install, .bin for the gateway's firmware upload.
          board=cytron_iriv_io_controller
          cp .pio/build/$board/firmware.bin firmware-$board.bin
          cp .pio/build/$board/firmware.uf2 firmware-$board.uf2
      - name: Build Wilcoxon ILA210 firmware and installer
        run: |
          pio run -d ILA210 -e esp32s3 -e cytron_iriv_io_controller
          pio run -d ILA210 -e esp32s3 -t webinstaller
          cp ILA210/.pio/build/esp32s3/firmware.bin firmware-ila210-esp32s3.bin
          cp ILA210/.pio/build/esp32s3/factory.bin factory-ila210-esp32s3.bin
          (cd ILA210/.pio/build/esp32s3/web-installer && zip -q "$GITHUB_WORKSPACE/web-installer-ila210-esp32s3.zip" *)
          cp ILA210/.pio/build/cytron_iriv_io_controller/firmware.bin firmware-ila210-cytron_iriv_io_controller.bin
          cp ILA210/.pio/build/cytron_iriv_io_controller/firmware.uf2 firmware-ila210-cytron_iriv_io_controller.uf2
      - name: Record firmware checksums
        run: sha256sum firmware-*.bin firmware-*.uf2 factory-*.bin web-installer-*.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-firmware
          path: |
            firmware-*.bin
            firmware-*.uf2
            web-installer-*.zip
            factory-*.bin
            SHA256SUMS.txt
  release:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gateway-firmware
      - name: Attach firmware to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Beta tags (v1.2.3-beta.N) become pre-releases that never replace "Latest";
          # the gateway updater only offers the latest stable release.
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            flags=(--prerelease)
          else
            flags=(--latest)
          fi
          python scripts/release_notes.py "$RELEASE_TAG" "$GH_REPO" > install-notes.md
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "Wilcoxon Sensor Gateways $RELEASE_TAG" --notes-file install-notes.md "${flags[@]}"
          gh release upload "$RELEASE_TAG" firmware-*.bin firmware-*.uf2 web-installer-*.zip factory-*.bin SHA256SUMS.txt --clobber
  installer:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/installer-pages.yml
  package:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gateway-firmware
      - name: Publish firmware image to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPO,,}"
          printf 'FROM scratch\nCOPY firmware-*.bin /\n' > Dockerfile
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tags=(-t "$image:${REF_NAME}")
          [[ "$REF_NAME" == *-beta.* ]] || tags+=(-t "$image:latest")
          docker build --label "org.opencontainers.image.source=https://github.com/${REPO}" "${tags[@]}" .
          for attempt in 1 2 3; do
            docker push --all-tags "$image" && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
