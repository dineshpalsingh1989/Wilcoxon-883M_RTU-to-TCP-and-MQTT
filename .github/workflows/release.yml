name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node demo/smoke_test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p "test_installer*.py"
  firmware:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18 certifi
      # Every [env:...] in platformio.ini is a supported board.
      - run: pio run
      - name: Bundle browser installer images
        run: pio run -t webinstaller
      - name: Prepare board binaries
        run: |
          for board in adafruit_feather_esp32s3 cytron_maker_esp32; do
            cp .pio/build/$board/firmware.bin firmware-$board.bin
            cp .pio/build/$board/factory.bin factory-$board.bin
            (cd .pio/build/$board/web-installer && zip -q "$GITHUB_WORKSPACE/web-installer-$board.zip" *)
          done
          # RP2350: .uf2 for USB drag-and-drop install, .bin for the gateway's firmware upload.
          board=cytron_iriv_io_controller
          cp .pio/build/$board/firmware.bin firmware-$board.bin
          cp .pio/build/$board/firmware.uf2 firmware-$board.uf2
      - name: Build Wilcoxon ILA210 firmware and installer
        run: |
          pio run -d ILA210 -e esp32s3 -e cytron_iriv_io_controller
          pio run -d ILA210 -e esp32s3 -t webinstaller
          cp ILA210/.pio/build/esp32s3/firmware.bin firmware-ila210-esp32s3.bin
          cp ILA210/.pio/build/esp32s3/factory.bin factory-ila210-esp32s3.bin
          (cd ILA210/.pio/build/esp32s3/web-installer && zip -q "$GITHUB_WORKSPACE/web-installer-ila210-esp32s3.zip" *)
          cp ILA210/.pio/build/cytron_iriv_io_controller/firmware.bin firmware-ila210-cytron_iriv_io_controller.bin
          cp ILA210/.pio/build/cytron_iriv_io_controller/firmware.uf2 firmware-ila210-cytron_iriv_io_controller.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-firmware
          path: |
            firmware-*.bin
            firmware-*.uf2
            web-installer-*.zip
            factory-*.bin
  release:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gateway-firmware
      - name: Attach firmware to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Beta tags (v1.2.3-beta.N) become pre-releases that never replace "Latest";
          # the gateway updater only offers the latest stable release.
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            flags=(--prerelease)
          else
            flags=(--latest)
          fi
          # Install instructions go above GitHub's generated change list.
          pages="https://${GH_REPO%%/*}.github.io/${GH_REPO#*/}/"
          {
            echo "## Install"
            echo
            echo "- **Easiest:** open the [web installer]($pages), choose **Wilcoxon 883M** or **Wilcoxon ILA210**, then choose your board. ESP32 installs use Chrome or Edge; IRIV installs use a UF2 download."
            echo "- **Manual, any flashing tool:** write \`factory-<board>.bin\` for your board at address \`0x0\`. This clears saved settings."
            echo "- **Gateway already running:** \`firmware-<board>.bin\` is the OTA update file."
            echo "- **IRIV IO Controller:** hold BOOT, press RESET, then copy \`firmware-cytron_iriv_io_controller.uf2\` to the drive that appears."
            echo
            echo "ILA210 files use the \`ila210-\` prefix: ESP32-S3 DevKitC (\`esp32s3\`) or IRIV (\`cytron_iriv_io_controller\`). Never interchange 883M and ILA210 images."
            echo
            echo "| Board | Chip | \`<board>\` in file names |"
            echo "|---|---|---|"
            echo "| Adafruit Feather ESP32-S3 | ESP32-S3 | \`adafruit_feather_esp32s3\` |"
            echo "| Cytron Maker ESP32 | ESP32 | \`cytron_maker_esp32\` |"
            echo "| Cytron IRIV IO Controller | RP2350A | \`cytron_iriv_io_controller\` (.uf2) |"
            echo
            echo "Guide and troubleshooting: [installing-firmware.md](https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/installing-firmware.md)"
          } > install-notes.md
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --notes "$(cat install-notes.md)" "${flags[@]}"
          gh release upload "$RELEASE_TAG" firmware-*.bin firmware-*.uf2 web-installer-*.zip factory-*.bin --clobber
  installer:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/installer-pages.yml
  package:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gateway-firmware
      - name: Publish firmware image to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPO,,}"
          printf 'FROM scratch\nCOPY firmware-*.bin /\n' > Dockerfile
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tags=(-t "$image:${REF_NAME}")
          [[ "$REF_NAME" == *-beta.* ]] || tags+=(-t "$image:latest")
          docker build --label "org.opencontainers.image.source=https://github.com/${REPO}" "${tags[@]}" .
          for attempt in 1 2 3; do
            docker push --all-tags "$image" && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
