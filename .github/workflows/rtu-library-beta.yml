name: RTU library beta
on:
  push:
    tags: ['wilcoxon883mrtu-v*-beta.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native RTU and TCP tests
        run: python experiments/Wilcoxon883MRTU-beta/tests/run_native.py
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Compile ESP32 examples
        run: |
          pio run --project-dir experiments/Wilcoxon883MRTU-beta/tests/esp32_compile
          pio run --project-dir experiments/Wilcoxon883MRTU-beta/tests/esp32_discovery
          pio run --project-dir experiments/Wilcoxon883MRTU-beta/tests/esp32_tcp
      - name: Package beta source library
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python experiments/Wilcoxon883MRTU-beta/tests/package_library.py --output dist --tag "$RELEASE_TAG"
          else
            python experiments/Wilcoxon883MRTU-beta/tests/package_library.py --output dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wilcoxon-rtu-beta-library
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/wilcoxon883mrtu-v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wilcoxon-rtu-beta-library
          path: dist
      - name: Publish source-only beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --prerelease --latest=false \
            --title "Wilcoxon883MRTU ${RELEASE_TAG#wilcoxon883mrtu-v} (Beta library)" \
            --notes-file experiments/Wilcoxon883MRTU-beta/RELEASE_NOTES.md
