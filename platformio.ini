; Settings shared by every supported board. Board pins live in src/config/config.h.
[env]
; Pinned to the tested platform: CI firmware builds have failed since espressif32 8.0.0 (2026-10-19).
platform = espressif32 @ 7.1.3
framework = arduino
build_flags = -Isrc
extra_scripts =
    pre:scripts/build_config.py
    post:scripts/web_installer.py
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit NeoPixel @ ^1.11.0
    ; Our own Modbus RTU client + TCP server, built from this repository.
    Wilcoxon883MRTU=symlink://experiments/Wilcoxon883MRTU-beta

[env:adafruit_feather_esp32s3]
board = adafruit_feather_esp32s3

; Cytron Maker ESP32 (ESP32-WROOM-32E, 8 MB flash, original ESP32 chip).
[env:cytron_maker_esp32]
board = esp32dev
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags = ${env.build_flags} -DBOARD_CYTRON_MAKER_ESP32

; Cytron IRIV IO Controller (RP2350A, 2 MB flash, wired Ethernet W5500, isolated RS485).
; Arduino-Pico core through the community Raspberry Pi platform, pinned to a tested commit.
[env:cytron_iriv_io_controller]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = cytron_iriv_io_controller
board_build.core = earlephilhower
; 1 MB for the program and 1 MB LittleFS for settings and staged firmware updates.
board_build.filesystem_size = 1m
build_flags = ${env.build_flags} -DBOARD_CYTRON_IRIV_IOC -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
; chain+ evaluates #if, so ESP32-only includes (e.g. Preferences.h) do not pull in look-alike libraries.
lib_ldf_mode = chain+
lib_ignore = Adafruit NeoPixel, iLabs_Hearth
