[platformio]
extra_configs =
    ESP32 Family/ESP32-S3/platformio.ini
    ESP32 Family/Cytron Maker ESP32/platformio.ini
    IRIV IOC/platformio.ini

; Settings shared by every supported board. Board pins live in src/config/config.h.
[env]
; Pinned to the tested platform: CI firmware builds have failed since espressif32 8.0.0 (2026-10-19).
platform = espressif32 @ 7.1.3
framework = arduino
build_flags = -Isrc
extra_scripts =
    pre:scripts/build_config.py
    post:scripts/web_installer.py
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit NeoPixel @ ^1.11.0
    ; Our own Modbus RTU client + TCP server, built from this repository.
    Wilcoxon883MRTU=symlink://experiments/Wilcoxon883MRTU-beta
