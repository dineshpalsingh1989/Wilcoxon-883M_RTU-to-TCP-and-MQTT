[platformio]
extra_configs =
    ESP32 Family/ESP32-S3/profile.ini
    ESP32 Family/Cytron Maker ESP32/profile.ini
    IRIV IOC/profile.ini

[env]
; Pinned to the tested platform: CI firmware builds have failed since espressif32 8.0.0 (2026-10-19).
platform = espressif32 @ 7.1.3
framework = arduino
build_flags = -Isrc
extra_scripts =
    pre:scripts/select_board.py
    pre:scripts/board_helpers.py
    post:scripts/web_installer.py
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit NeoPixel @ ^1.11.0
