<g fill="#c6dbe8" font-size="17"><text x="64" y="216">USB / supported input power</text><text x="495" y="216">3.3 V-compatible logic</text><text x="925" y="216">Use manual terminal labels</text><text x="180" y="264">GPIO17 TX</text><text x="180" y="314">GPIO18 RX</text><text x="180" y="364">GPIO14</text><text x="180" y="434">GND</text><text x="495" y="264">DI</text><text x="495" y="314">RO</text><text x="495" y="364">DE + /RE</text><text x="495" y="434">GND</text><text x="670" y="264">A</text><text x="670" y="314">B</text><text x="925" y="264">RS485 A</text><text x="925" y="314">RS485 B</text><text x="925" y="434">Signal reference*</text><text x="925" y="476">Power + / return</text><text x="925" y="595">Voltage per sensor manual</text><text x="495" y="476">VCC per module specification</text></g>
