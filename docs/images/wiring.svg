<g fill="#c6dbe8" font-size="15"><text x="44" y="550">* Reference connection shown for a non-isolated interface.</text><text x="44" y="578">For isolated modules, follow the module's bus-side reference and power instructions.</text><text x="44" y="624">Verify connector pinout, supply voltage and A/B naming in the sensor manual.</text><text x="44" y="651">Sensor DC power must never connect directly to an ESP32 GPIO or 3.3 V rail.</text></g></g></svg>
