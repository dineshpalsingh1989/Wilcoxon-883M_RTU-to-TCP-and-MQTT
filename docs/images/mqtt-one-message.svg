<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">One capture, one MQTT message</title>
<desc id="d">Before: the gateway split each axis capture into 98 small MQTT pieces, and the back end had to collect, sort and check them. Now: the gateway first counts the message size, then formats and sends the waveform in 1 KB pieces through one MQTT message, so the back end receives the whole 13,334-point waveform at once. The gateway needs about 3 KB of RAM for this instead of about 300 KB.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#16364a"/></linearGradient>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#34d399"/></marker>
<g id="env"><rect width="34" height="22" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/><path d="M0 1 L17 13 L34 1" fill="none" stroke="#f87171" stroke-width="1.5"/></g>
<g id="cloud" fill="#cbd5e1"><circle cx="-35" cy="7" r="32"/><circle cx="0" cy="-15" r="40"/><circle cx="40" cy="5" r="32"/><rect x="-45" y="3" width="95" height="34" rx="10"/></g>
<g id="kb"><rect width="44" height="28" rx="5" fill="#34d399"/><text x="22" y="19" font-size="11" font-weight="700" fill="#064e3b" text-anchor="middle">1 KB</text></g>
</defs>
<rect width="1200" height="720" rx="20" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="48" y="52" fill="#38bdf8" font-size="15" letter-spacing="3">MQTT WAVEFORM DELIVERY</text>
<text x="48" y="92" fill="#f8fafc" font-size="30" font-weight="700">One capture, one message</text>
<text x="48" y="122" fill="#a9c2d7" font-size="16">Your back end receives the whole waveform at once. No collecting, sorting or joining.</text>

<!-- Before -->
<rect x="40" y="150" width="1120" height="210" rx="16" fill="#2b1c26" stroke="#f87171" stroke-opacity=".5" stroke-width="2"/>
<text x="64" y="182" fill="#fca5a5" font-size="15" font-weight="700">BEFORE · old firmware: 98 small pieces per axis</text>
<line x1="145" y1="215" x2="145" y2="198" stroke="#94a3b8" stroke-width="3"/><circle cx="145" cy="193" r="6" fill="#fbbf24"/>
<rect x="80" y="215" width="130" height="105" rx="18" fill="#2563eb"/>
<circle cx="120" cy="255" r="9" fill="#fff"/><circle cx="170" cy="255" r="9" fill="#fff"/>
<circle cx="122" cy="256" r="4" fill="#0f172a"/><circle cx="172" cy="256" r="4" fill="#0f172a"/>
<path d="M118 285 Q145 303 172 285" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="145" y="342" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Gateway</text>
<g font-size="11" fill="#fca5a5" text-anchor="middle">
<use href="#env" x="250" y="220"/><text x="267" y="214">1</text>
<use href="#env" x="300" y="250"/><text x="317" y="244">2</text>
<use href="#env" x="350" y="228"/><text x="367" y="222">3</text>
<use href="#env" x="400" y="262"/><text x="417" y="256">4</text>
<use href="#env" x="450" y="232"/><text x="467" y="226">…</text>
<use href="#env" x="500" y="248"/><text x="517" y="242">96</text>
<use href="#env" x="550" y="224"/><text x="567" y="218">97</text>
<use href="#env" x="600" y="258"/><text x="617" y="252">98</text>
</g>
<text x="440" y="318" fill="#fca5a5" font-size="14" text-anchor="middle">67 waveform pieces + 31 spectrum pieces</text>
<use href="#cloud" x="770" y="255"/>
<text x="772" y="276" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">Broker</text>
<rect x="930" y="212" width="150" height="100" rx="14" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
<rect x="940" y="222" width="130" height="80" rx="8" fill="#334155"/>
<circle cx="980" cy="256" r="8" fill="#fff"/><circle cx="1030" cy="256" r="8" fill="#fff"/>
<path d="M968 244 L990 237 M1042 244 L1020 237" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
<path d="M977 287 q6 -7 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<path d="M1092 214 q9 13 0 19 q-9 -6 0 -19z" fill="#7dd3fc"/>
<rect x="995" y="312" width="20" height="14" fill="#64748b"/><rect x="970" y="326" width="70" height="7" rx="3" fill="#64748b"/>
<text x="1005" y="352" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Your back end</text>
<rect x="872" y="162" width="276" height="36" rx="12" fill="#fef2f2"/><path d="M990 197 l8 11 l6 -11z" fill="#fef2f2"/>
<text x="1010" y="185" fill="#7f1d1d" font-size="13" text-anchor="middle">Wait for 98, sort, check none is missing…</text>

<!-- Now -->
<rect x="40" y="380" width="1120" height="300" rx="16" fill="#10302b" stroke="#34d399" stroke-opacity=".5" stroke-width="2"/>
<text x="64" y="412" fill="#6ee7b7" font-size="15" font-weight="700">NOW · each waveform and each spectrum is one complete message</text>
<line x1="145" y1="470" x2="145" y2="453" stroke="#94a3b8" stroke-width="3"/><circle cx="145" cy="448" r="6" fill="#fbbf24"/>
<rect x="80" y="470" width="130" height="105" rx="18" fill="#2563eb"/>
<circle cx="120" cy="510" r="9" fill="#fff"/><circle cx="170" cy="510" r="9" fill="#fff"/>
<circle cx="122" cy="511" r="4" fill="#0f172a"/><circle cx="172" cy="511" r="4" fill="#0f172a"/>
<path d="M114 538 Q145 565 176 538" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="145" y="597" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Gateway</text>
<circle cx="200" cy="463" r="5" fill="#ecfdf5"/><circle cx="214" cy="451" r="7" fill="#ecfdf5"/>
<rect x="226" y="422" width="372" height="40" rx="20" fill="#ecfdf5"/>
<circle cx="250" cy="442" r="12" fill="#059669"/><text x="250" y="447" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">1</text>
<text x="270" y="447" fill="#064e3b" font-size="14">Count the size first (e.g. 92,960 bytes)</text>
<rect x="220" y="500" width="430" height="44" rx="22" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
<use href="#kb" x="240" y="508"/><use href="#kb" x="295" y="508"/><use href="#kb" x="350" y="508"/><use href="#kb" x="405" y="508"/>
<use href="#kb" x="460" y="508"/><use href="#kb" x="515" y="508"/><use href="#kb" x="570" y="508"/>
<line x1="652" y1="522" x2="700" y2="522" stroke="#34d399" stroke-width="4" marker-end="url(#a)"/>
<circle cx="250" cy="572" r="12" fill="#059669"/><text x="250" y="577" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">2</text>
<text x="270" y="577" fill="#6ee7b7" font-size="14" font-weight="700">Format and send in 1 KB pieces</text>
<text x="270" y="597" fill="#a7f3d0" font-size="13">the whole message is never held in RAM</text>
<use href="#cloud" x="770" y="515"/>
<text x="772" y="536" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">Broker</text>
<rect x="852" y="480" width="142" height="66" rx="8" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
<path d="M852 492 H994" stroke="#b45309" stroke-width="2"/>
<text x="923" y="511" fill="#451a03" font-size="14" font-weight="700" text-anchor="middle">Waveform X</text>
<text x="923" y="527" fill="#451a03" font-size="12" text-anchor="middle">13,334 points</text>
<text x="923" y="541" fill="#451a03" font-size="12" text-anchor="middle">1 message</text>
<rect x="1010" y="467" width="130" height="100" rx="14" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
<rect x="1020" y="477" width="110" height="80" rx="8" fill="#334155"/>
<path d="M1044 511 q8 -11 16 0 M1090 511 q8 -11 16 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<path d="M1050 530 Q1075 550 1100 530" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<rect x="1065" y="567" width="20" height="14" fill="#64748b"/><rect x="1040" y="581" width="70" height="7" rx="3" fill="#64748b"/>
<text x="1075" y="607" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Your back end</text>
<rect x="890" y="424" width="255" height="36" rx="12" fill="#ecfdf5"/><path d="M1060 459 l8 9 l5 -9z" fill="#ecfdf5"/>
<text x="1017" y="447" fill="#064e3b" font-size="13" text-anchor="middle">Got it all. Use it directly!</text>
<text x="64" y="641" fill="#e2e8f0" font-size="14" font-weight="700">Gateway RAM needed:</text>
<rect x="250" y="627" width="6" height="18" rx="2" fill="#34d399"/>
<text x="264" y="641" fill="#a7f3d0" font-size="13">about 3 KB with streaming</text>
<rect x="250" y="651" width="600" height="18" rx="4" fill="#475569"/>
<text x="262" y="664" fill="#e2e8f0" font-size="12.5">about 300 KB if built in RAM first: too big for the Maker ESP32 and IRIV</text>

<text x="600" y="706" fill="#a9c2d7" font-size="14" text-anchor="middle">Same for the spectrum: 6,145 bins in one message (about 15–45 KB). Brokers must accept messages up to about 110 KB.</text>
</g>
</svg>
