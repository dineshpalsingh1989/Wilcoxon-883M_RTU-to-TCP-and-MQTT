<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Install the gateway in four steps</title>
  <desc id="d">1: open the web installer in Chrome or Edge. 2: plug the Feather ESP32-S3 into the computer with a USB-C cable. 3: click Install, pick the port and wait about a minute. 4: press RESET, join the ILA_Sensor_AP Wi-Fi network and open 192.168.4.1.</desc>
  <rect width="1000" height="330" rx="16" fill="#f5f7fa"/>
  <g fill="#ffffff" stroke="#dde3ea" stroke-width="1.5">
    <rect x="12" y="12" width="232" height="306" rx="12"/>
    <rect x="256" y="12" width="232" height="306" rx="12"/>
    <rect x="500" y="12" width="232" height="306" rx="12"/>
    <rect x="744" y="12" width="232" height="306" rx="12"/>
  </g>
  <g fill="#0b6bcb">
    <circle cx="44" cy="44" r="17"/><circle cx="288" cy="44" r="17"/><circle cx="532" cy="44" r="17"/><circle cx="776" cy="44" r="17"/>
  </g>
  <g fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">
    <text x="44" y="51">1</text><text x="288" y="51">2</text><text x="532" y="51">3</text><text x="776" y="51">4</text>
  </g>
  <g fill="#1b2430" font-size="17" font-weight="700">
    <text x="70" y="50">Open the installer</text>
    <text x="314" y="50">Plug in USB-C</text>
    <text x="558" y="50">Click Install</text>
    <text x="802" y="50">Connect to Wi-Fi</text>
  </g>

  <!-- 1: browser window -->
  <rect x="34" y="80" width="188" height="140" rx="8" fill="#ffffff" stroke="#5b6675" stroke-width="2"/>
  <path d="M34 88a8 8 0 0 1 8-8h172a8 8 0 0 1 8 8v16H34z" fill="#e8edf3"/>
  <circle cx="46" cy="92" r="4" fill="#e06666"/><circle cx="58" cy="92" r="4" fill="#e8c46a"/><circle cx="70" cy="92" r="4" fill="#6abf69"/>
  <rect x="82" y="86" width="130" height="12" rx="6" fill="#ffffff"/>
  <text x="88" y="96" font-size="9" fill="#5b6675">…github.io/…883M…</text>
  <text x="48" y="128" font-size="12" font-weight="700" fill="#1b2430">883M Gateway Installer</text>
  <rect x="48" y="140" width="160" height="34" rx="6" fill="#f5f7fa" stroke="#dde3ea"/>
  <text x="56" y="161" font-size="11" fill="#1b2430">Stable</text>
  <rect x="148" y="146" width="52" height="22" rx="5" fill="#0b6bcb"/>
  <text x="174" y="161" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Install</text>
  <rect x="48" y="182" width="110" height="6" rx="3" fill="#dde3ea"/><rect x="48" y="196" width="80" height="6" rx="3" fill="#dde3ea"/>
  <text x="128" y="252" font-size="13" fill="#1b2430" text-anchor="middle">Chrome or Edge</text>
  <text x="128" y="270" font-size="13" fill="#1b2430" text-anchor="middle">on a computer</text>
  <text x="128" y="296" font-size="11" fill="#5b6675" text-anchor="middle">No software to install</text>

  <!-- 2: board and cable -->
  <rect x="276" y="96" width="92" height="112" rx="6" fill="#ffffff" stroke="#5b6675" stroke-width="2"/>
  <rect x="290" y="102" width="64" height="9" rx="2" fill="#1b2430"/>
  <rect x="294" y="128" width="30" height="30" rx="3" fill="#5b6675"/>
  <rect x="332" y="132" width="24" height="12" rx="2" fill="#dde3ea" stroke="#5b6675"/>
  <text x="344" y="141" font-size="7" fill="#1b2430" text-anchor="middle">BOOT</text>
  <rect x="332" y="150" width="24" height="12" rx="2" fill="#dde3ea" stroke="#5b6675"/>
  <text x="344" y="159" font-size="7" fill="#1b2430" text-anchor="middle">RESET</text>
  <text x="322" y="182" font-size="9" font-weight="700" fill="#1b2430" text-anchor="middle">Feather</text>
  <text x="322" y="194" font-size="9" font-weight="700" fill="#1b2430" text-anchor="middle">ESP32-S3</text>
  <path d="M322 96V84q0-10 10-10h70q10 0 10 10v34" fill="none" stroke="#0b6bcb" stroke-width="4" stroke-linecap="round"/>
  <rect x="404" y="118" width="16" height="22" rx="3" fill="#0b6bcb"/>
  <rect x="396" y="140" width="76" height="52" rx="4" fill="#ffffff" stroke="#5b6675" stroke-width="2"/>
  <rect x="402" y="146" width="64" height="40" rx="2" fill="#e8edf3"/>
  <path d="M386 192h96l-8 12h-80z" fill="#5b6675"/>
  <text x="372" y="252" font-size="13" fill="#1b2430" text-anchor="middle">Use a USB-C</text>
  <text x="372" y="270" font-size="13" fill="#1b2430" text-anchor="middle"><tspan font-weight="700">data</tspan> cable</text>
  <text x="372" y="296" font-size="11" fill="#5b6675" text-anchor="middle">Charge-only cables show no port</text>

  <!-- 3: port picker and progress -->
  <rect x="522" y="80" width="188" height="140" rx="8" fill="#ffffff" stroke="#5b6675" stroke-width="2"/>
  <text x="536" y="102" font-size="11" font-weight="700" fill="#1b2430">Select a serial port</text>
  <rect x="536" y="112" width="160" height="22" rx="4" fill="#e3f0fc" stroke="#0b6bcb"/>
  <text x="544" y="127" font-size="10" fill="#1b2430">USB serial port (COM5)</text>
  <rect x="640" y="142" width="56" height="20" rx="5" fill="#0b6bcb"/>
  <text x="668" y="156" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Connect</text>
  <text x="536" y="186" font-size="10" fill="#5b6675">Installing… 64%</text>
  <rect x="536" y="194" width="160" height="10" rx="5" fill="#dde3ea"/>
  <rect x="536" y="194" width="102" height="10" rx="5" fill="#0b6bcb"/>
  <text x="616" y="252" font-size="13" fill="#1b2430" text-anchor="middle">Pick the board's port,</text>
  <text x="616" y="270" font-size="13" fill="#1b2430" text-anchor="middle">wait about a minute</text>
  <text x="616" y="296" font-size="11" fill="#5b6675" text-anchor="middle">No port? Hold BOOT, tap RESET</text>

  <!-- 4: phone Wi-Fi list -->
  <rect x="808" y="72" width="104" height="156" rx="14" fill="#ffffff" stroke="#5b6675" stroke-width="2"/>
  <rect x="844" y="80" width="32" height="5" rx="2.5" fill="#dde3ea"/>
  <text x="820" y="104" font-size="10" font-weight="700" fill="#1b2430">Wi-Fi</text>
  <rect x="816" y="112" width="88" height="24" rx="4" fill="#e3f0fc" stroke="#0b6bcb"/>
  <text x="822" y="128" font-size="9" font-weight="700" fill="#1b2430">ILA_Sensor_AP</text>
  <rect x="822" y="146" width="60" height="6" rx="3" fill="#dde3ea"/><rect x="822" y="162" width="48" height="6" rx="3" fill="#dde3ea"/>
  <rect x="816" y="184" width="88" height="20" rx="4" fill="#f5f7fa" stroke="#dde3ea"/>
  <text x="860" y="198" font-size="9" fill="#1b2430" text-anchor="middle">192.168.4.1</text>
  <text x="860" y="252" font-size="13" fill="#1b2430" text-anchor="middle">Press RESET, join</text>
  <text x="860" y="270" font-size="13" fill="#1b2430" text-anchor="middle"><tspan font-weight="700">ILA_Sensor_AP</tspan></text>
  <text x="860" y="296" font-size="11" fill="#5b6675" text-anchor="middle">Password 12345678</text>
</svg>
